name: Onboarding browser check
on:
  pull_request:
    paths:
      - "app/page.tsx"
      - "app/v2.css"
      - "tests/**"
      - "playwright.config.mjs"
      - ".github/workflows/onboarding-check.yml"
jobs:
  onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://build-placeholder.supabase.co
      SUPABASE_SECRET_KEY: build-placeholder-not-a-real-key
      SESSION_SECRET: build-placeholder-not-a-real-session-secret-32chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: onboarding-browser-results
          path: test-results/
          retention-days: 7
