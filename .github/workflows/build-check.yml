name: Build check

on:
  push:
    branches:
      - "fix/v2.0.8-line-share-actual-image"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Non-production placeholders for module initialization during Next.js build.
          # This CI job never sends requests to the placeholder Supabase host.
          SUPABASE_URL: https://build-placeholder.supabase.co
          SUPABASE_SECRET_KEY: build-placeholder-not-a-real-key
